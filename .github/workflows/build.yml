# Build workflow for remove_transparent_margins
#
# • On every push and pull request: compiles and runs the test suite.
# • On version tags (v*): builds release binaries for Linux and Windows
#   and uploads them as GitHub Actions artifacts.
#
# Compiled binaries can be downloaded from the run page under
# Actions → <run> → Artifacts:
#
#   • remove-transparent-margins-linux   – CLI + GUI for Linux
#   • remove-transparent-margins-windows – CLI + GUI for Windows (.exe)

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  # ── CI – compile check & tests (every push / PR) ───────────────────────────
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries required by egui/eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev \
            libgtk-3-dev

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  # ── Release build & upload (version tags only) ─────────────────────────────
  build-linux:
    name: Build (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries required by egui/eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev \
            libgtk-3-dev

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: remove-transparent-margins-linux
          path: |
            target/release/remove_transparent_margins
            target/release/remove_transparent_margins_gui

  build-windows:
    name: Build (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: remove-transparent-margins-windows
          path: |
            target\release\remove_transparent_margins.exe
            target\release\remove_transparent_margins_gui.exe
