# Build workflow for remove_transparent_margins
#
# Builds both the CLI and GUI binaries in release mode on every push and
# pull request, targeting Linux (ubuntu-latest) and Windows (windows-latest).
#
# Compiled binaries are uploaded as GitHub Actions artifacts and can be
# downloaded from the run page under Actions → <run> → Artifacts:
#
#   • remove-transparent-margins-linux   – CLI + GUI for Linux
#   • remove-transparent-margins-windows – CLI + GUI for Windows (.exe)

name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ── Linux build ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries required by egui/eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev \
            libgtk-3-dev

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: remove-transparent-margins-linux
          path: |
            target/release/remove_transparent_margins
            target/release/remove_transparent_margins_gui

  # ── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: remove-transparent-margins-windows
          path: |
            target\release\remove_transparent_margins.exe
            target\release\remove_transparent_margins_gui.exe
