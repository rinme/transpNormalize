[package]
name = "remove_transparent_margins"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "remove_transparent_margins"
path = "src/main.rs"

[[bin]]
name = "remove_transparent_margins_gui"
path = "src/gui_main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33", features = ["wgpu"] }
rfd = "0.17"
